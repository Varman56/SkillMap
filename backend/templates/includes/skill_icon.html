{% if not level or level == 0 %}
    <!-- Уровень 0 — нет навыка -->
    <svg width="22" height="22" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke="#E5E7EB" stroke-width="1.5" fill="none"/>
    </svg>

{% elif fill_level and fill_level < level %}
    <!-- Совмещённая иконка (навык сразу с подтверждённым уровнем И заявкой
         на более высокий, см. matrix_page.py): контур до level (то, что
         запрошено, ещё не подтверждено) рисуем ЯНТАРНЫМ (тот же цвет, что
         и статус «на рассмотрении» в профиле и все остальные неапрувные
         иконки в матрице, см. ниже), а сплошной заливкой фирменным
         фиолетовым — сектор до fill_level (то, что уже подтверждено).
         Наложение двух иконок одна на другую: часть закрашена
         (подтверждено), часть — только контур (заявка). -->
    <svg width="22" height="22" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke="#D69E2E" stroke-width="1.5" fill="none"/>

        {% if level == 1 %}
            <path d="M12 12 L12 3 A9 9 0 0 1 21 12 Z" fill="none" stroke="#D69E2E" stroke-width="1.5"/>
        {% elif level == 2 %}
            <path d="M12 12 L12 3 A9 9 0 0 1 12 21 Z" fill="none" stroke="#D69E2E" stroke-width="1.5"/>
        {% elif level == 3 %}
            <path d="M12 12 L12 3 A9 9 0 1 1 3 12 Z" fill="none" stroke="#D69E2E" stroke-width="1.5"/>
        {% endif %}

        {% if fill_level == 1 %}
            <path d="M12 12 L12 3 A9 9 0 0 1 21 12 Z" fill="#ab4ad5"/>
        {% elif fill_level == 2 %}
            <path d="M12 12 L12 3 A9 9 0 0 1 12 21 Z" fill="#ab4ad5"/>
        {% elif fill_level == 3 %}
            <path d="M12 12 L12 3 A9 9 0 1 1 3 12 Z" fill="#ab4ad5"/>
        {% elif fill_level == 4 %}
            <circle cx="12" cy="12" r="9" fill="#ab4ad5"/>
        {% endif %}
    </svg>

{% elif level == 4 or level == "Senior" or level == "Expert" or level == 5 %}
    <!-- УРОВЕНЬ 4 и 5 -->
    {% if confirmed %}
        <svg width="22" height="22" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" fill="#ab4ad5"/>
        </svg>
    {% else %}
        <!-- Не апрув — янтарный контур (см. общее пояснение по цвету выше). -->
        <svg width="22" height="22" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="#D69E2E" stroke-width="1.5" fill="none"/>
        </svg>
    {% endif %}

{% else %}
    <!-- УРОВНИ 1, 2, 3 -->
    <svg width="22" height="22" viewBox="0 0 24 24">
        <!-- Внешнее кольцо тоже меняет цвет по статусу — иначе при
             is_approved=False получалось наполовину фиолетовое (кольцо),
             наполовину янтарное (сектор), см. фикс ниже. -->
        <circle cx="12" cy="12" r="9" stroke="{% if confirmed %}#ab4ad5{% else %}#D69E2E{% endif %}" stroke-width="1.5" fill="none"/>

        {% if level == 1 or level == "Intern" %}
            <path d="M12 12 L12 3 A9 9 0 0 1 21 12 Z" {% if confirmed %}fill="#ab4ad5"{% else %}fill="none" stroke="#D69E2E" stroke-width="1.5"{% endif %}/>
        {% elif level == 2 or level == "Junior" %}
            <path d="M12 12 L12 3 A9 9 0 0 1 12 21 Z" {% if confirmed %}fill="#ab4ad5"{% else %}fill="none" stroke="#D69E2E" stroke-width="1.5"{% endif %}/>
        {% elif level == 3 or level == "Middle" %}
            <path d="M12 12 L12 3 A9 9 0 1 1 3 12 Z" {% if confirmed %}fill="#ab4ad5"{% else %}fill="none" stroke="#D69E2E" stroke-width="1.5"{% endif %}/>
        {% endif %}
    </svg>
{% endif %}
