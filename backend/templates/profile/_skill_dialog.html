{% if can_edit %}
<dialog id="skillDialog" class="profile-dialog">
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="add_skill">

        <!-- Раньше в этом списке были вперемешку и совсем новые навыки, и
             уже подтверждённые (только с более высокими уровнями) — искать
             тут "свой" навык, чтобы попросить повышение, было нелогично.
             Теперь этот диалог — ТОЛЬКО для навыков, которых у вас вообще
             нет (см. available_skills/known_skill_ids в profile_page.py).
             Запрос повышения для уже подтверждённого навыка — прямо в его
             строке в списке навыков (карандаш на строке, см. profile.html). -->
        <h3>Добавить навык</h3>

        <label for="skill-id">Навык</label>
        <select id="skill-id" name="skill_id" required>
            <option value="">Выберите навык</option>

            {% for skill in available_skills %}
                <option value="{{ skill.id }}">{{ skill.display_name }}</option>
            {% endfor %}
        </select>

        <!-- Список уровней больше не подстраивается JS'ом под выбранный
             навык — раньше это было нужно, чтобы обрезать варианты до
             уровней выше уже подтверждённого, но теперь в этом списке
             навыков с подтверждённым уровнем нет вообще (см. выше), все
             4 уровня всегда валидны для любого варианта. -->
        <label for="skill-level">Уровень</label>
        <select id="skill-level" name="level" required>
            {% for level in levels %}
                <option value="{{ level }}">{{ level }}</option>
            {% endfor %}
        </select>

        <div class="profile-dialog-actions">
            <button type="submit">Добавить</button>
            <button type="button" data-close-dialog>Отмена</button>
        </div>
    </form>
</dialog>
{% endif %}
