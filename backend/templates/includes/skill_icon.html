{% if not level or level == 0 %}
    <!-- Уровень 0 — нет навыка -->
    <svg width="22" height="22" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke="#E5E7EB" stroke-width="1.5" fill="none"/>
    </svg>

{% elif level == 4 or level == "Senior" or level == "Expert" or level == 5 %}
    <!-- УРОВЕНЬ 4 и 5 -->
    {% if confirmed %}
        <svg width="22" height="22" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" fill="#ab4ad5"/>
        </svg>
    {% else %}
        <svg width="22" height="22" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="#ab4ad5" stroke-width="1.5" fill="none"/>
        </svg>
    {% endif %}

{% else %}
    <!-- УРОВНИ 1, 2, 3 -->
    <svg width="22" height="22" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke="#ab4ad5" stroke-width="1.5" fill="none"/>
        
        {% if level == 1 or level == "Intern" %}
            <path d="M12 12 L12 3 A9 9 0 0 1 21 12 Z" {% if confirmed %}fill="#ab4ad5"{% else %}fill="none" stroke="#ab4ad5" stroke-width="1.5"{% endif %}/>
        {% elif level == 2 or level == "Junior" %}
            <path d="M12 12 L12 3 A9 9 0 0 1 12 21 Z" {% if confirmed %}fill="#ab4ad5"{% else %}fill="none" stroke="#ab4ad5" stroke-width="1.5"{% endif %}/>
        {% elif level == 3 or level == "Middle" %}
            <path d="M12 12 L12 3 A9 9 0 1 1 3 12 Z" {% if confirmed %}fill="#ab4ad5"{% else %}fill="none" stroke="#ab4ad5" stroke-width="1.5"{% endif %}/>
        {% endif %}
    </svg>
{% endif %}
